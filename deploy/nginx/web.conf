server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    # 允许大文件上传（与后端 multipart 2GB 对齐；nginx 默认仅 1MB 会 413）
    client_max_body_size 2g;

    # 用 Docker 内嵌 DNS 运行时解析后端服务名。配合下方 proxy_pass 中的变量，
    # nginx 每 10s 重新解析 gateway，避免 gateway 容器重建换 IP 后 nginx 仍连旧 IP（表现为整站 502）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（避免浏览器加载旧 hash 的 JS bundle）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /platform-config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /platform-config.json =404;
    }

    # 反向代理业务 API 到网关（DDD：前端↔gateway:8080）
    # 变量 $api_backend 强制 nginx 走 resolver 动态解析（静态 proxy_pass 只在启动时解析一次，后端换 IP 即 502）
    location /api/ {
        set $api_backend "gateway:8080";
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # WebSocket（训练日志/通知/Agent）透传
    location /ws/ {
        set $ws_backend "gateway:8080";
        proxy_pass http://$ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
