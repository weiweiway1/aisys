server:
  port: 8005
  shutdown: graceful

spring:
  application:
    name: aisys-evaluation
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # 双连接池：app 受 RLS 约束；admin 带 BYPASSRLS（DDD 4.1.3）
  datasource:
    app:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_APP_USER:aisys_app}
      password: ${PG_APP_PASSWORD:aisys_app_pwd}
      maximum-pool-size: ${DB_POOL:8}
      connection-timeout: 20000
    admin:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_ADMIN_USER:aisys_platform_admin}
      password: ${PG_ADMIN_PASSWORD:aisys_admin_pwd}
      maximum-pool-size: 3
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        register-enabled: ${NACOS_REGISTER:true}

# 注意：不要写 spring.flyway.*，迁移由 common-mybatis 的 FlywayConfig 用 app 连接池自动执行（classpath:db/migration）。
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

aisys:
  jwt:
    issuer: aisys-auth
    public-key: ${AISYS_JWT_PUBLIC_KEY:}
  outbox:
    enabled: true           # 评测生产 task.command 事件
    poll-interval-ms: 3000
  # ==================== LLM 配置（评测报告生成）====================
  # URL 必填；API Key 可选（本地部署模型如 Ollama/vLLM 通常不需要）
  llm:
    url: ${LLM_URL:http://host.docker.internal:11434/api/generate}                                # 例: https://api.openai.com 或 http://localhost:11434 (Ollama)
    api-key: ${LLM_API_KEY:}                        # 可选，本地模型留空即可
    model: ${LLM_MODEL:"qwen2:latest"}               # 模型名称
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}      # 超时秒数

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.aisys: INFO
    org.springframework: WARN
