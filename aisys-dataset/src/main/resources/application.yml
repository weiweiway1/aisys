server:
  port: 8003
  shutdown: graceful

spring:
  application:
    name: aisys-dataset
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  # /upload 代理直传是 multipart 端点；Spring 默认 max-file-size=1MB 会拒绝任何真实数据集版本。
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10GB}
      max-request-size: ${MAX_REQUEST_SIZE:10GB}

  # 双连接池：app 受 RLS 约束；admin 带 BYPASSRLS（DDD 4.1.3）
  datasource:
    app:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_APP_USER:aisys_app}
      password: ${PG_APP_PASSWORD:aisys_app_pwd}
      maximum-pool-size: ${DB_POOL:8}
      connection-timeout: 20000
    admin:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_ADMIN_USER:aisys_platform_admin}
      password: ${PG_ADMIN_PASSWORD:aisys_admin_pwd}
      maximum-pool-size: 3
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        register-enabled: ${NACOS_REGISTER:true}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

aisys:
  jwt:
    issuer: aisys-auth
    public-key: ${AISYS_JWT_PUBLIC_KEY:}
  s3:
    endpoint: ${S3_ENDPOINT:http://seaweedfs:8333}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:aisys}
    secret-key: ${S3_SECRET_KEY:aisyssecret}
    bucket: ${S3_BUCKET:aisys}
    path-style-access: true
    presign-minutes: 60
  outbox:
    enabled: false   # dataset 不生产业务事件（本服务不需要 MQ outbox）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.aisys: INFO
    org.springframework: WARN
