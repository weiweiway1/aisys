server:
  port: 8009
  shutdown: graceful

spring:
  application:
    name: aisys-monitor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # 双连接池：app 受 RLS 约束；admin 带 BYPASSRLS（DDD 4.1.3）
  datasource:
    app:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_APP_USER:aisys_app}
      password: ${PG_APP_PASSWORD:aisys_app_pwd}
      maximum-pool-size: ${DB_POOL:8}
      connection-timeout: 20000
    admin:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_ADMIN_USER:aisys_platform_admin}
      password: ${PG_ADMIN_PASSWORD:aisys_admin_pwd}
      maximum-pool-size: 3
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        register-enabled: ${NACOS_REGISTER:true}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

aisys:
  jwt:
    issuer: aisys-auth
    public-key: ${AISYS_JWT_PUBLIC_KEY:}
  outbox:
    enabled: false   # monitor 不生产业务事件，不承担 outbox 投递

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.aisys: INFO
    org.springframework: WARN
