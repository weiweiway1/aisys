server:
  port: 8004
  shutdown: graceful

spring:
  application:
    name: aisys-training
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # 双连接池：app 受 RLS 约束；admin 带 BYPASSRLS（DDD 4.1.3）
  datasource:
    app:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_APP_USER:aisys_app}
      password: ${PG_APP_PASSWORD:aisys_app_pwd}
      maximum-pool-size: ${DB_POOL:8}
      connection-timeout: 20000
    admin:
      url: jdbc:postgresql://${PG_HOST:postgresql}:${PG_PORT:5432}/${PG_DB:aisys}
      username: ${PG_ADMIN_USER:aisys_platform_admin}
      password: ${PG_ADMIN_PASSWORD:aisys_admin_pwd}
      maximum-pool-size: 3
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 50
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        register-enabled: ${NACOS_REGISTER:true}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

aisys:
  jwt:
    issuer: aisys-auth
    # 业务服务只需公钥
    public-key: ${AISYS_JWT_PUBLIC_KEY:}
  outbox:
    enabled: true   # training 生产 task.command / notification 事件
    poll-interval-ms: ${OUTBOX_POLL_MS:3000}
  training:
    metrics-downsample-seconds: ${METRICS_DOWNSAMPLE:15}
    # 默认 Docker 镜像名（当请求未提供 image 且 containerSpec.imageName 为空时使用）
    # 留空则要求必须显式指定镜像（推荐，避免误用不存在的镜像）
    default-image: ${TRAINING_DEFAULT_IMAGE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.aisys: INFO
    org.springframework: WARN
